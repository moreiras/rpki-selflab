# ==============================================================================
# Lab parameters
#
# Edit here and only here: the routers, the scripts, the panel and the
# on-screen guide all pick up the new values.
#
# After editing:   ./scripts/lab.sh up
# ==============================================================================

# Language of the web panels and of the messages printed by the scripts.
#   en  English
#   es  Spanish
#   pt  Portuguese
#
# This is only the default: each browser can switch languages on its own
# panel (the choice is saved locally and does not affect other viewers).
LANGUAGE=pt

# Where resource certification comes from:
#
#   local  simulated RIR inside the lab (self-contained, no Internet needed)
#   beta   the Registro.br test system (needs Internet and the holder's login
#          at https://beta.registro.br)
MODE=local

# Identity of the simulated registry (only used when MODE=local)
RIR_NAME="LabNIC"
RIR_DESCRIPTION="Laboratory Internet registry"

# Holder data, as it would appear on a registry's panel
HOLDER_NAME="ACME Internet Ltda."
HOLDER_DOC="98.765.432/0001-00"
HOLDER_HANDLE=ACME-1

# The origin AS's number (the one that originates the announcements)
ORIGIN_ASN=64500

# IPv4 prefix and the ROA's max length
ORIGIN_V4=10.0.0.0/24
ORIGIN_V4_MAXLEN=24

# IPv6 prefix and the ROA's max length
ORIGIN_V6=3fff:cafe::/32
ORIGIN_V6_MAXLEN=32

# ------------------------------------------------------------------------------
# The ASNs below are documentation ASNs (RFC 5398, the AS64496-AS64511 block)
# and work regardless of which origin ASN/prefixes you chose above. Only
# change them if you have a good reason: they show up in the observers'
# filters and in the marking large communities.
# ------------------------------------------------------------------------------
PROVIDER_A_ASN=64501
PROVIDER_B_ASN=64502

# observer1: BIRD + Routinator
OBSERVER1_ASN=64510

# observer2: OpenBGPD + FORT Validator (the second opinion, see README)
OBSERVER2_ASN=64511

# ------------------------------------------------------------------------------
# The guide's story (AS666 and peer): a hijacker that is a customer of
# the observers, and a legitimate peer of the origin that leaks routes to Provider A.
#
# ATTACKER_ASN isn't in any IANA-reserved block - 666 is just memorable - but
# that's harmless here: this network never touches the real Internet. PEER_ASN
# is in the 16-bit private-use range (RFC 6996), not the same documentation
# block (RFC 5398) as the ASNs above.
# ------------------------------------------------------------------------------
ATTACKER_ASN=666
PEER_ASN=64999
