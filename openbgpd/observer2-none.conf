################################################################################
# observer2 - OpenBGPD + FORT Validator  (STAGE none: plain BGP, no validation deployed)
#
# The observer as it comes up: an ordinary BGP router. It accepts whatever its
# neighbors send and has no idea what a ROA or an ASPA is - no RTR session to a
# validator, no policy that looks at validation results. Everything the guide's
# story does to the lab happens on top of this.
#
# Switch stages with ./scripts/lab.sh (step1-clean, step3-rov-mark,
# step3-rov-drop, step5-aspa-mark, step5-aspa-drop). observer1 (BIRD + Routinator)
# is switched together with this one: see bird/observer1-none.conf.
################################################################################

# ASNs come from lab.conf, translated into macros by scripts/generate-config.sh
include "/etc/openbgpd-lab/vars.conf"

AS $observer2_asn
router-id 10.0.0.95

# ---------------------------------------------------------------------------
# The sessions with the two providers and with AS666.
# ---------------------------------------------------------------------------
neighbor 10.200.5.10 {
    remote-as $provider_a_asn
    descr "provider-a-v4"
    local-address 10.200.5.20
}
neighbor fd00:5::10 {
    remote-as $provider_a_asn
    descr "provider-a-v6"
    local-address fd00:5::20
}
neighbor 10.200.6.10 {
    remote-as $provider_b_asn
    descr "provider-b-v4"
    local-address 10.200.6.20
}
neighbor fd00:6::10 {
    remote-as $provider_b_asn
    descr "provider-b-v6"
    local-address fd00:6::20
}

# AS666 - the "attacker" from the guide's story, a customer connecting directly. Treated exactly like the providers.
neighbor 10.200.8.10 {
    remote-as $attacker_asn
    descr "attacker-v4"
    local-address 10.200.8.20
}
neighbor fd00:8::10 {
    remote-as $attacker_asn
    descr "attacker-v6"
    local-address fd00:8::20
}

# ---------------------------------------------------------------------------
# No policy: every route is accepted as it comes.
# ---------------------------------------------------------------------------
deny from any
allow from any
