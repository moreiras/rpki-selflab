################################################################################
# observer2 - OpenBGPD + rpki-client  (STAGE none: plain BGP, no validation deployed)
#
# The observer as it comes up: an ordinary BGP router. It accepts whatever its
# neighbors send and has no idea what a ROA or an ASPA is - no validated data
# included, no policy that looks at validation results. Everything the guide's
# story does to the lab happens on top of this.
#
# Switch stages with ./scripts/lab.sh (step1-clean, step3-rov-mark,
# step5-aspa-mark, step8-drop). observer1 (BIRD + Routinator) and observer3
# (OpenBGPD + FORT) are switched together with this one: see
# bird/observer1-none.conf and openbgpd/observer3-none.conf.
################################################################################

# ASNs come from lab.conf, translated into macros by scripts/generate-config.sh
include "/etc/openbgpd-lab/vars.conf"

AS $observer2_asn
router-id 10.0.0.94

# ---------------------------------------------------------------------------
# The sessions with the two providers and with AS666.
# ---------------------------------------------------------------------------
neighbor 10.200.11.10 {
    remote-as $provider_a_asn
    descr "provider-a-v4"
    local-address 10.200.11.20
}
neighbor fd00:11::10 {
    remote-as $provider_a_asn
    descr "provider-a-v6"
    local-address fd00:11::20
}
neighbor 10.200.12.10 {
    remote-as $provider_b_asn
    descr "provider-b-v4"
    local-address 10.200.12.20
}
neighbor fd00:12::10 {
    remote-as $provider_b_asn
    descr "provider-b-v6"
    local-address fd00:12::20
}

# AS666 - the "attacker" from the guide's story, a customer connecting directly. Treated exactly like the providers.
neighbor 10.200.13.10 {
    remote-as $attacker_asn
    descr "attacker-v4"
    local-address 10.200.13.20
}
neighbor fd00:13::10 {
    remote-as $attacker_asn
    descr "attacker-v6"
    local-address fd00:13::20
}

# ---------------------------------------------------------------------------
# No policy: every route is accepted as it comes.
# ---------------------------------------------------------------------------
deny from any
allow from any
