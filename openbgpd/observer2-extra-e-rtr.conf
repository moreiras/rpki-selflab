################################################################################
# observer2 - OpenBGPD + rpki-client over RTR  (the guide's extra exercise E)
#
# observer2-aspa-mark.conf with ONE change: instead of including the file
# rpki-client writes, bgpd gets the same data over RTR from RTRTR, which reads
# rpki-client's JSON output on this same host ("rpki-rtr start").
#
# This is how rpki-client feeds routers that only speak RTR (most commercial
# ones). In production the RTR server usually runs next to the validator, not
# on the router.
#
# Not a deployment stage: apply it by hand (see the guide), and go back with
# ./scripts/lab.sh step6-add-provider-b.
################################################################################

# ASNs come from lab.conf, translated into macros by scripts/generate-config.sh
include "/etc/openbgpd-lab/vars.conf"

AS $observer2_asn
router-id 10.0.0.94

# ---------------------------------------------------------------------------
# 1) The validator: still rpki-client, now through RTRTR on this host. The
#    "include" of /var/db/rpki-client/openbgpd is gone; an RTR session takes
#    its place, exactly like observer3's with FORT.
# ---------------------------------------------------------------------------
rtr 127.0.0.1 {
    port 3323
    # ASPA PDUs only exist in RTR version 2 (see observer3-aspa-mark.conf)
    min-version 2
}

# ---------------------------------------------------------------------------
# 2) Sessions with the two providers and with AS666.
#
# "role provider" is not decoration. OpenBGPD only performs ASPA verification
# on sessions that carry an RFC 9234 role, and the role decides WHICH ASPA
# algorithm runs. The observers sit above the providers - announcements flow
# up from the origin - so observer2 is the neighbors' upstream and routes
# arrive here from a customer. That selects the upstream-path algorithm, the
# same one observer1 asks BIRD for with aspa_check_upstream().
#
# With "role customer" the downstream algorithm would run instead, and the
# AS_PATH through a provider missing from the ASPA would come back Valid or
# Unknown instead of Invalid (guide, extra exercise A).
# ---------------------------------------------------------------------------
neighbor 10.200.11.10 {
    remote-as $provider_a_asn
    descr "provider-a-v4"
    local-address 10.200.11.20
    role provider
}
neighbor fd00:11::10 {
    remote-as $provider_a_asn
    descr "provider-a-v6"
    local-address fd00:11::20
    role provider
}
neighbor 10.200.12.10 {
    remote-as $provider_b_asn
    descr "provider-b-v4"
    local-address 10.200.12.20
    role provider
}
neighbor fd00:12::10 {
    remote-as $provider_b_asn
    descr "provider-b-v6"
    local-address fd00:12::20
    role provider
}

# AS666 - the "attacker" from the guide's story, a customer connecting directly. Treated exactly like the providers.
neighbor 10.200.13.10 {
    remote-as $attacker_asn
    descr "attacker-v4"
    local-address 10.200.13.20
    role provider
}
neighbor fd00:13::10 {
    remote-as $attacker_asn
    descr "attacker-v6"
    local-address fd00:13::20
    role provider
}

# ---------------------------------------------------------------------------
# 3) The policy: test each route and act on the result.
# ---------------------------------------------------------------------------
deny from any
allow from any

match from any ovs invalid    set { localpref 10 }      # lose to any valid route
match from any avs invalid    set { localpref 20 }      # lose to a valid path
match from any avs valid      set { localpref 200 }     # prefer a proven path
