################################################################################
# observer2 - Extra exercise A: the role that decides the algorithm
#
# Identical to openbgpd/observer2-aspa-mark.conf, except Provider B's two
# sessions carry "role customer" instead of "role provider" - the ONLY
# change. That flips which ASPA algorithm OpenBGPD runs for paths arriving
# over those sessions: upstream (strict, every hop checked) becomes
# downstream (permissive). Same objects, same AS_PATH, different verdict -
# read the guide's Extra exercise A for what to look at before and after.
#
# Requires the ASPA object to list ONLY Provider A at the time (the guide
# has you do that with krillc before applying this file).
#
# Apply by hand:
#   docker exec lab-observer2 sh -c \
#     "cp /etc/openbgpd-lab/observer2-extra-a-role-customer.conf /etc/bgpd.conf && bgpctl reload"
# Undo (back to the story's normal aspa-mark stage):
#   ./scripts/lab.sh step5-aspa-mark
################################################################################

# ASNs come from lab.conf, translated into macros by scripts/generate-config.sh
include "/etc/openbgpd-lab/vars.conf"

AS $observer2_asn
router-id 10.0.0.95

rtr 172.30.0.50 {
    port 3323
    min-version 2
}

neighbor 10.200.5.10 {
    remote-as $provider_a_asn
    descr "provider-a-v4"
    local-address 10.200.5.20
    role provider
}
neighbor fd00:5::10 {
    remote-as $provider_a_asn
    descr "provider-a-v6"
    local-address fd00:5::20
    role provider
}
# Provider B, downstream algorithm instead of upstream - the exercise's one
# change.
neighbor 10.200.6.10 {
    remote-as $provider_b_asn
    descr "provider-b-v4"
    local-address 10.200.6.20
    role customer
}
neighbor fd00:6::10 {
    remote-as $provider_b_asn
    descr "provider-b-v6"
    local-address fd00:6::20
    role customer
}

neighbor 10.200.8.10 {
    remote-as $attacker_asn
    descr "attacker-v4"
    local-address 10.200.8.20
    role provider
}
neighbor fd00:8::10 {
    remote-as $attacker_asn
    descr "attacker-v6"
    local-address fd00:8::20
    role provider
}

# ---------------------------------------------------------------------------
# 3) The policy: test each route and act on the result.
# ---------------------------------------------------------------------------
deny from any
allow from any

match from any ovs invalid    set { localpref 10 }      # lose to any valid route
match from any avs invalid    set { localpref 20 }      # lose to a valid path
match from any avs valid      set { localpref 200 }     # prefer a proven path
