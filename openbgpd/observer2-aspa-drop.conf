################################################################################
# observer2 - OpenBGPD + rpki-client  (STAGE aspa-drop: ROV dropping + ASPA verification dropping)
#
# The full policy: ROV Invalid AND ASPA Invalid routes are rejected on import.
# This is where a real, fully deployed router ends up.
#
# Switch stages with ./scripts/lab.sh (step1-clean, step3-rov-mark,
# step5-aspa-mark, step8-drop). observer1 (BIRD + Routinator) and observer3
# (OpenBGPD + FORT) are switched together with this one: see
# bird/observer1-aspa-drop.conf and openbgpd/observer3-aspa-drop.conf.
#
# OpenBGPD computes the verdicts natively, per route:
#   ovs   origin validation state (RFC 6811): valid | not-found | invalid
#   avs   ASPA validation state:              valid | unknown   | invalid
#
# Read them with:  bgpctl show rib detail
################################################################################

# ASNs come from lab.conf, translated into macros by scripts/generate-config.sh
include "/etc/openbgpd-lab/vars.conf"

AS $observer2_asn
router-id 10.0.0.94

# ---------------------------------------------------------------------------
# 1) The validator: rpki-client, on this same host. It writes the validated
#    ROAs (roa-set) and ASPAs (aspa-set) into a file that bgpd includes; the
#    periodic job (rpki-refresh) re-runs it and reloads bgpd when the data
#    changes. There is no RTR session, so no protocol version to negotiate:
#    the aspa-set arrives with the file. Compare with observer3's "rtr" block.
# ---------------------------------------------------------------------------
include "/var/db/rpki-client/openbgpd"

# ---------------------------------------------------------------------------
# 2) Sessions with the two providers and with AS666.
#
# "role provider" is not decoration. OpenBGPD only performs ASPA verification
# on sessions that carry an RFC 9234 role, and the role decides WHICH ASPA
# algorithm runs. The observers sit above the providers - announcements flow
# up from the origin - so observer2 is the neighbors' upstream and routes
# arrive here from a customer. That selects the upstream-path algorithm, the
# same one observer1 asks BIRD for with aspa_check_upstream().
#
# With "role customer" the downstream algorithm would run instead, and the
# AS_PATH through a provider missing from the ASPA would come back Valid or
# Unknown instead of Invalid (guide, extra exercise A).
# ---------------------------------------------------------------------------
neighbor 10.200.11.10 {
    remote-as $provider_a_asn
    descr "provider-a-v4"
    local-address 10.200.11.20
    role provider
}
neighbor fd00:11::10 {
    remote-as $provider_a_asn
    descr "provider-a-v6"
    local-address fd00:11::20
    role provider
}
neighbor 10.200.12.10 {
    remote-as $provider_b_asn
    descr "provider-b-v4"
    local-address 10.200.12.20
    role provider
}
neighbor fd00:12::10 {
    remote-as $provider_b_asn
    descr "provider-b-v6"
    local-address fd00:12::20
    role provider
}

# AS666 - the "attacker" from the guide's story, a customer connecting directly. Treated exactly like the providers.
neighbor 10.200.13.10 {
    remote-as $attacker_asn
    descr "attacker-v4"
    local-address 10.200.13.20
    role provider
}
neighbor fd00:13::10 {
    remote-as $attacker_asn
    descr "attacker-v6"
    local-address fd00:13::20
    role provider
}

# ---------------------------------------------------------------------------
# 3) The policy: test each route and act on the result.
# ---------------------------------------------------------------------------
deny from any
allow from any

deny from any ovs invalid                               # ROV Invalid: rejected
deny from any avs invalid                               # ASPA Invalid: rejected
match from any avs valid      set { localpref 200 }     # prefer a proven path
