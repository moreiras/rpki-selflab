################################################################################
# observer2 - OpenBGPD + FORT Validator  (STAGE rov-mark: ROV deployed, marking only)
#
# ROV (route origin validation, RFC 6811) is deployed in its safe first form:
# the router learns the ROAs from a validator, tests every route against them,
# and only MARKS the result - a large community (so you can read it) and a
# local-pref (so an invalid route loses to a valid one). Nothing is dropped.
# This is how you roll ROV out for real: watch what it would do before you let
# it reject anything.
#
# Switch stages with ./scripts/lab.sh (step1-clean, step3-rov-mark,
# step3-rov-drop, step5-aspa-mark, step5-aspa-drop). observer1 (BIRD + Routinator)
# is switched together with this one: see bird/observer1-rov-mark.conf.
#
# OpenBGPD computes the verdicts natively, per route:
#   ovs   origin validation state (RFC 6811): valid | not-found | invalid
#
# Read them with:  bgpctl show rib detail
################################################################################

# ASNs come from lab.conf, translated into macros by scripts/generate-config.sh
include "/etc/openbgpd-lab/vars.conf"

AS $observer2_asn
router-id 10.0.0.95

# ---------------------------------------------------------------------------
# 1) The validator: FORT hands the ROAs over RTR.
# ---------------------------------------------------------------------------
rtr 172.30.0.50 {
    port 3323
}

# ---------------------------------------------------------------------------
# 2) Sessions with the two providers and with AS666.
# ---------------------------------------------------------------------------
neighbor 10.200.5.10 {
    remote-as $provider_a_asn
    descr "provider-a-v4"
    local-address 10.200.5.20
}
neighbor fd00:5::10 {
    remote-as $provider_a_asn
    descr "provider-a-v6"
    local-address fd00:5::20
}
neighbor 10.200.6.10 {
    remote-as $provider_b_asn
    descr "provider-b-v4"
    local-address 10.200.6.20
}
neighbor fd00:6::10 {
    remote-as $provider_b_asn
    descr "provider-b-v6"
    local-address fd00:6::20
}

# AS666 - the "attacker" from the guide's story, a customer connecting directly. Treated exactly like the providers.
neighbor 10.200.8.10 {
    remote-as $attacker_asn
    descr "attacker-v4"
    local-address 10.200.8.20
}
neighbor fd00:8::10 {
    remote-as $attacker_asn
    descr "attacker-v6"
    local-address fd00:8::20
}

# ---------------------------------------------------------------------------
# 3) The policy: test each route and act on the result.
# ---------------------------------------------------------------------------
deny from any
allow from any

match from any ovs invalid    set { localpref 10 }      # lose to any valid route
