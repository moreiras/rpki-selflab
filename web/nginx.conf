server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The step-by-step script, read and rendered by the panel. One file per
    # language; the panel picks which one to fetch.
    location ~ ^/GUIDE\.(pt|es|en)\.md$ {
        alias /srv/guide/GUIDE.$1.md;
        # nginx's "charset" directive only auto-appends charset for a
        # built-in list of MIME types (text/html, text/plain, ...), and
        # text/markdown isn't one of them - so "charset utf-8" here would be
        # a silent no-op and the browser would guess Latin-1. Spelling the
        # charset into default_type itself sets it unconditionally.
        default_type "text/markdown; charset=utf-8";
        add_header Cache-Control "no-store";
    }

    # Lab state, produced by the lab-status container
    location = /api/status.json {
        alias /srv/status/status.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    # Routinator proxy (avoids a CORS issue when the panel queries it)
    location /api/routinator/ {
        proxy_pass http://routinator:8323/;
        proxy_http_version 1.1;
    }
}

# ---------------------------------------------------------------------------
# Everything else the student opens, reachable through this one port under
# <name>.localhost (browsers resolve *.localhost to the local machine, so no
# DNS or hosts-file entry is needed). Each of these web apps expects to own
# the root of its site (absolute /assets/... paths), which is why they get a
# name each instead of a path prefix.
# ---------------------------------------------------------------------------
# Names are looked up when a request comes in (not at start-up), so nginx
# doesn't refuse to start when one of these containers isn't there.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Krill, the student's CA. Talks HTTPS with a self-signed certificate on the
# inside; the browser only ever sees plain HTTP here, so there's no warning.
server {
    listen 80;
    listen [::]:80;
    server_name krill.localhost;
    client_max_body_size 16m;
    location / {
        set $up https://krill:3000;
        proxy_pass $up;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_read_timeout 300s;
    }
}

# Krill of the simulated registry (LabNIC's own CA)
server {
    listen 80;
    listen [::]:80;
    server_name rir-krill.localhost;
    location / {
        set $up https://rir:3000;
        proxy_pass $up;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }
}

# The simulated registry's panel (only exists with MODE=local)
server {
    listen 80;
    listen [::]:80;
    server_name registry.localhost;
    location / {
        set $up http://rir-web:8081;
        proxy_pass $up;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name routinator.localhost;
    location / {
        set $up http://routinator:8323;
        proxy_pass $up;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }
}

# Browser terminals (ttyd, which needs WebSockets)
server {
    listen 80;
    listen [::]:80;
    server_name console.localhost;
    location / {
        set $up http://console:7681;
        proxy_pass $up;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_read_timeout 1d;
    }
}
