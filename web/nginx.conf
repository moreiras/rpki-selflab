server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The step-by-step script, read and rendered by the panel. One file per
    # language; the panel picks which one to fetch.
    location ~ ^/GUIDE\.(pt|es|en)\.md$ {
        alias /srv/guide/GUIDE.$1.md;
        # nginx's "charset" directive only auto-appends charset for a
        # built-in list of MIME types (text/html, text/plain, ...), and
        # text/markdown isn't one of them - so "charset utf-8" here would be
        # a silent no-op and the browser would guess Latin-1. Spelling the
        # charset into default_type itself sets it unconditionally.
        default_type "text/markdown; charset=utf-8";
        add_header Cache-Control "no-store";
    }

    # Lab state, produced by the lab-status container
    location = /api/status.json {
        alias /srv/status/status.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    # Routinator proxy (avoids a CORS issue when the panel queries it)
    location /api/routinator/ {
        proxy_pass http://routinator:8323/;
        proxy_http_version 1.1;
    }
}
