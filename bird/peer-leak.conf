################################################################################
# peer (AS64499) - route leak (./scripts/lab.sh step7-leak-on)
#
# Same as peer-off.conf, except the session with Provider A now exports
# everything in the table - which, since peer has no routes of its own,
# means exactly the origin's prefixes it learned over the private peering
# link a moment ago. Nothing is forged: the AS_PATH that results is the
# honest, unmodified one ("<provider-a> <peer> <origin>" by the time it
# reaches an observer). The mistake isn't a lie, it's exporting to a
# provider something that should have stayed on the peering link.
################################################################################

include "/etc/bird-lab/vars.conf";

log stderr all;
router id 10.0.0.52;

protocol device { }

protocol bgp origin_v4 {
    description "Peering with the origin AS (private link) - IPv4";
    local as PEER_ASN;
    source address 10.200.9.10;
    neighbor 10.200.9.20 as ORIGIN_ASN;
    ipv4 { import all; export none; };
}
protocol bgp origin_v6 {
    description "Peering with the origin AS (private link) - IPv6";
    local as PEER_ASN;
    source address fd00:9::10;
    neighbor fd00:9::20 as ORIGIN_ASN;
    ipv6 { import all; export none; };
}

protocol bgp provider_a_v4 {
    description "Transit from Provider A - IPv4 (LEAKING the peering route)";
    local as PEER_ASN;
    source address 10.200.10.10;
    neighbor 10.200.10.20 as PROVIDER_A_ASN;
    ipv4 { import none; export all; };
}
protocol bgp provider_a_v6 {
    description "Transit from Provider A - IPv6 (LEAKING the peering route)";
    local as PEER_ASN;
    source address fd00:10::10;
    neighbor fd00:10::20 as PROVIDER_A_ASN;
    ipv6 { import none; export all; };
}
