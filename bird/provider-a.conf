################################################################################
# PROVIDER A - one of the origin's two upstreams
#
# Receives the prefixes from the origin AS and passes them on to BOTH
# observers: observer1 (BIRD + Routinator) and observer2 (OpenBGPD + FORT).
# Documentation ASN, RFC 5398.
################################################################################

include "/etc/bird-lab/vars.conf";

log stderr all;
router id 10.0.0.96;

protocol device { }

protocol bgp customer_v4 {
    description "Customer: origin AS - IPv4";
    local as PROVIDER_A_ASN;
    source address 10.200.1.20;
    neighbor 10.200.1.10 as ORIGIN_ASN;
    ipv4 { import all; export none; };
}
protocol bgp customer_v6 {
    description "Customer: origin AS - IPv6";
    local as PROVIDER_A_ASN;
    source address fd00:1::20;
    neighbor fd00:1::10 as ORIGIN_ASN;
    ipv6 { import all; export none; };
}

protocol bgp observer1_v4 {
    description "observer1 (BIRD) - IPv4";
    local as PROVIDER_A_ASN;
    source address 10.200.3.10;
    neighbor 10.200.3.20 as OBSERVER1_ASN;
    ipv4 { import none; export all; };
}
protocol bgp observer1_v6 {
    description "observer1 (BIRD) - IPv6";
    local as PROVIDER_A_ASN;
    source address fd00:3::10;
    neighbor fd00:3::20 as OBSERVER1_ASN;
    ipv6 { import none; export all; };
}

protocol bgp observer2_v4 {
    description "observer2 (OpenBGPD) - IPv4";
    local as PROVIDER_A_ASN;
    source address 10.200.5.10;
    neighbor 10.200.5.20 as OBSERVER2_ASN;
    # observer2 resets its sessions whenever the deployment stage changes; BIRD's default
    # error wait (60-300 s, growing with every flap) would make each switch take
    # minutes to settle, so retry fast.
    connect retry time 5;
    error wait time 1, 5;
    ipv4 { import none; export all; };
}
protocol bgp observer2_v6 {
    description "observer2 (OpenBGPD) - IPv6";
    local as PROVIDER_A_ASN;
    source address fd00:5::10;
    neighbor fd00:5::20 as OBSERVER2_ASN;
    # observer2 resets its sessions whenever the deployment stage changes; BIRD's default
    # error wait (60-300 s, growing with every flap) would make each switch take
    # minutes to settle, so retry fast.
    connect retry time 5;
    error wait time 1, 5;
    ipv6 { import none; export all; };
}

# peer (AS64499) - a customer of this provider, like the origin. Nothing
# special is configured for it: when it leaks the origin's prefix (see the
# guide's route-leak experiment), its 2-hop path "peer origin" simply beats
# the origin's own announcement to this provider, which is prepended (3 hops).
# This router does no filtering of its own on what a customer sends it.

protocol bgp customer_peer_v4 {
    description "Customer: peer AS - IPv4";
    local as PROVIDER_A_ASN;
    source address 10.200.10.20;
    neighbor 10.200.10.10 as PEER_ASN;
    ipv4 { import all; export none; };
}
protocol bgp customer_peer_v6 {
    description "Customer: peer AS - IPv6";
    local as PROVIDER_A_ASN;
    source address fd00:10::20;
    neighbor fd00:10::10 as PEER_ASN;
    ipv6 { import all; export none; };
}
