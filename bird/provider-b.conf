################################################################################
# PROVIDER B - the origin's other upstream
#
# Passes the prefix on to both observers. In the guide's story the origin
# first publishes an ASPA object that forgets to list it (so the path through
# here is marked ASPA Invalid) and later fixes it.
# Documentation ASN, RFC 5398.
################################################################################

include "/etc/bird-lab/vars.conf";

log stderr all;
router id 10.0.0.97;

protocol device { }

protocol bgp customer_v4 {
    description "Customer: origin AS - IPv4";
    local as PROVIDER_B_ASN;
    source address 10.200.2.20;
    neighbor 10.200.2.10 as ORIGIN_ASN;
    ipv4 { import all; export none; };
}
protocol bgp customer_v6 {
    description "Customer: origin AS - IPv6";
    local as PROVIDER_B_ASN;
    source address fd00:2::20;
    neighbor fd00:2::10 as ORIGIN_ASN;
    ipv6 { import all; export none; };
}

protocol bgp observer1_v4 {
    description "observer1 (BIRD) - IPv4";
    local as PROVIDER_B_ASN;
    source address 10.200.4.10;
    neighbor 10.200.4.20 as OBSERVER1_ASN;
    ipv4 { import none; export all; };
}
protocol bgp observer1_v6 {
    description "observer1 (BIRD) - IPv6";
    local as PROVIDER_B_ASN;
    source address fd00:4::10;
    neighbor fd00:4::20 as OBSERVER1_ASN;
    ipv6 { import none; export all; };
}

protocol bgp observer2_v4 {
    description "observer2 (OpenBGPD) - IPv4";
    local as PROVIDER_B_ASN;
    source address 10.200.6.10;
    neighbor 10.200.6.20 as OBSERVER2_ASN;
    # observer2 resets its sessions whenever the deployment stage changes; BIRD's default
    # error wait (60-300 s, growing with every flap) would make each switch take
    # minutes to settle, so retry fast.
    connect retry time 5;
    error wait time 1, 5;
    ipv4 { import none; export all; };
}
protocol bgp observer2_v6 {
    description "observer2 (OpenBGPD) - IPv6";
    local as PROVIDER_B_ASN;
    source address fd00:6::10;
    neighbor fd00:6::20 as OBSERVER2_ASN;
    # observer2 resets its sessions whenever the deployment stage changes; BIRD's default
    # error wait (60-300 s, growing with every flap) would make each switch take
    # minutes to settle, so retry fast.
    connect retry time 5;
    error wait time 1, 5;
    ipv6 { import none; export all; };
}
