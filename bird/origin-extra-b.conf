################################################################################
# ORIGIN - Extra exercise B: right ASN, prefix too specific (IPv6)
#
# Identical to bird/origin.conf, plus two IPv6 sub-blocks of ORIGIN_V6, each
# more specific than the ROA's max length (ORIGIN_V6_MAXLEN) - a completely
# normal thing to do with IPv6 (unlike deaggregating an IPv4 /24 down to a
# /25, which gets filtered network-wide and would feel contrived here). One
# sub-block goes only to Provider A, the other only to Provider B, so the
# exercise shows the same ROV Invalid verdict happening independently on
# both paths - it isn't about either provider, it's about the prefix.
#
# Apply by hand:
#   docker exec lab-origin birdc 'configure "/etc/bird-lab/origin-extra-b.conf"'
# Undo (back to the origin's normal config):
#   docker exec lab-origin birdc 'configure "/etc/bird.conf"'
################################################################################

include "/etc/bird-lab/vars.conf";

log stderr all;
router id 10.0.0.77;

protocol device { }

# Two /40s inside ORIGIN_V6 (a /32) - more specific than ORIGIN_V6_MAXLEN
# authorizes, on purpose.
define EXTRA_B_V6_A = 3fff:cafe:1000::/40;
define EXTRA_B_V6_B = 3fff:cafe:2000::/40;

protocol static origin4 {
    ipv4;
    route ORIGIN_V4 unreachable;
}

protocol static origin6 {
    ipv6;
    route ORIGIN_V6 unreachable;
    route EXTRA_B_V6_A unreachable;
    route EXTRA_B_V6_B unreachable;
}

filter only_mine_v4 {
    if net = ORIGIN_V4 && source = RTS_STATIC then accept;
    reject;
}

# Provider B's default export (also used by peer): the base prefix, plus
# the sub-block meant only for Provider B.
filter only_mine_v6_extra_b {
    if (net = ORIGIN_V6 || net = EXTRA_B_V6_B) && source = RTS_STATIC then accept;
    reject;
}

filter prepended_v4 {
    if net = ORIGIN_V4 && source = RTS_STATIC then {
        bgp_path.prepend(ORIGIN_ASN);
        bgp_path.prepend(ORIGIN_ASN);
        accept;
    }
    reject;
}

# Provider A's export: the base prefix (prepended, as usual), plus the
# sub-block meant only for Provider A.
filter prepended_v6_extra_b {
    if (net = ORIGIN_V6 || net = EXTRA_B_V6_A) && source = RTS_STATIC then {
        bgp_path.prepend(ORIGIN_ASN);
        bgp_path.prepend(ORIGIN_ASN);
        accept;
    }
    reject;
}

template bgp UPSTREAM4 {
    local as ORIGIN_ASN;
    ipv4 { import none; export filter only_mine_v4; };
}

template bgp UPSTREAM6 {
    local as ORIGIN_ASN;
    ipv6 { import none; export filter only_mine_v6_extra_b; };
}

protocol bgp provider_a_v4 from UPSTREAM4 {
    description "Provider A - IPv4";
    ipv4 { import none; export filter prepended_v4; };
    source address 10.200.1.10;
    neighbor 10.200.1.20 as PROVIDER_A_ASN;
}
protocol bgp provider_a_v6 from UPSTREAM6 {
    description "Provider A - IPv6";
    ipv6 { import none; export filter prepended_v6_extra_b; };
    source address fd00:1::10;
    neighbor fd00:1::20 as PROVIDER_A_ASN;
}

protocol bgp provider_b_v4 from UPSTREAM4 {
    description "Provider B - IPv4";
    source address 10.200.2.10;
    neighbor 10.200.2.20 as PROVIDER_B_ASN;
}
protocol bgp provider_b_v6 from UPSTREAM6 {
    description "Provider B - IPv6";
    source address fd00:2::10;
    neighbor fd00:2::20 as PROVIDER_B_ASN;
}

protocol bgp peer_v4 from UPSTREAM4 {
    description "peer (private peering) - IPv4";
    source address 10.200.9.20;
    neighbor 10.200.9.10 as PEER_ASN;
}
protocol bgp peer_v6 from UPSTREAM6 {
    description "peer (private peering) - IPv6";
    source address fd00:9::20;
    neighbor fd00:9::10 as PEER_ASN;
}
