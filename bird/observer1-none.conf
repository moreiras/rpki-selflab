################################################################################
# observer1 - BIRD + Routinator  (STAGE none: plain BGP, no validation deployed)
#
# The observer as it comes up: an ordinary BGP router. It accepts whatever its
# neighbors send and has no idea what a ROA or an ASPA is - no RTR session to a
# validator, no policy that looks at validation results. Everything the guide's
# story does to the lab happens on top of this.
#
# Switch stages with ./scripts/lab.sh (step1-clean, step3-rov-mark,
# step5-aspa-mark, step8-drop). Compare this file with the
# other observer1-*.conf: what changes from one stage to the next is the lesson.
#
# observer2 (OpenBGPD + FORT) is switched together with this one and does the
# same thing in its own words: see openbgpd/observer2-none.conf.
################################################################################

include "/etc/bird-lab/vars.conf";

# Not used by any session: it only lets the panel tell which stage's file BIRD
# has loaded (birdc "show symbols filter" lists it).
filter stage_none_marker { accept; }

log stderr all;
router id 10.0.0.98;

protocol device { }

# Every session accepts everything. ("import table on" keeps the Adj-RIB-In,
# which the later stages need in order to revalidate routes on their own.)
template bgp CUSTOMER4 {
    local as OBSERVER1_ASN;
    ipv4 {
        import all;
        export none;
        import table on;
    };
}

template bgp CUSTOMER6 {
    local as OBSERVER1_ASN;
    ipv6 {
        import all;
        export none;
        import table on;
    };
}

protocol bgp provider_a_v4 from CUSTOMER4 {
    description "Provider A - IPv4";
    source address 10.200.3.20;
    neighbor 10.200.3.10 as PROVIDER_A_ASN;
}
protocol bgp provider_a_v6 from CUSTOMER6 {
    description "Provider A - IPv6";
    source address fd00:3::20;
    neighbor fd00:3::10 as PROVIDER_A_ASN;
}
protocol bgp provider_b_v4 from CUSTOMER4 {
    description "Provider B - IPv4";
    source address 10.200.4.20;
    neighbor 10.200.4.10 as PROVIDER_B_ASN;
}
protocol bgp provider_b_v6 from CUSTOMER6 {
    description "Provider B - IPv6";
    source address fd00:4::20;
    neighbor fd00:4::10 as PROVIDER_B_ASN;
}

# AS666 - the "attacker" from the guide's story. Same templates as the providers,
# so it gets exactly the same treatment: nothing about it is special-cased.
protocol bgp attacker_v4 from CUSTOMER4 {
    description "AS666 (attacker, a direct customer) - IPv4";
    source address 10.200.7.20;
    neighbor 10.200.7.10 as ATTACKER_ASN;
}
protocol bgp attacker_v6 from CUSTOMER6 {
    description "AS666 (attacker, a direct customer) - IPv6";
    source address fd00:7::20;
    neighbor fd00:7::10 as ATTACKER_ASN;
}
