################################################################################
# ORIGIN - the lab's origin AS
#
# Originates the prefixes and is multihomed: it has sessions with Provider A
# and Provider B, plus a private peering link with "peer" (see peer_v4/v6
# below). Provider B is the preferred way in: the announcement to Provider A
# is prepended twice, so every path through A looks two hops longer to the
# rest of the world (classic inbound traffic engineering).
#
# >>> The ASN and prefixes are set in lab.conf <<<
################################################################################

# ASN and prefixes come from lab.conf, translated into "define" statements
# by scripts/generate-config.sh
include "/etc/bird-lab/vars.conf";

log stderr all;
router id 10.0.0.77;

protocol device { }

# The origin's prefixes. There's no data plane in this lab: the routes are
# "unreachable", just so they exist in the table and get exported over BGP.
protocol static origin4 {
    ipv4;
    route ORIGIN_V4 unreachable;
}

protocol static origin6 {
    ipv6;
    route ORIGIN_V6 unreachable;
}

# We only announce what's ours, and accept nothing back (the lab doesn't
# need a full table at the origin).
filter only_mine_v4 {
    if net = ORIGIN_V4 && source = RTS_STATIC then accept;
    reject;
}

filter only_mine_v6 {
    if net = ORIGIN_V6 && source = RTS_STATIC then accept;
    reject;
}

# The same, with the origin's own ASN prepended twice before the session adds
# it once more: the path leaving for Provider A reads "ORIGIN ORIGIN ORIGIN".
filter prepended_v4 {
    if net = ORIGIN_V4 && source = RTS_STATIC then {
        bgp_path.prepend(ORIGIN_ASN);
        bgp_path.prepend(ORIGIN_ASN);
        accept;
    }
    reject;
}

filter prepended_v6 {
    if net = ORIGIN_V6 && source = RTS_STATIC then {
        bgp_path.prepend(ORIGIN_ASN);
        bgp_path.prepend(ORIGIN_ASN);
        accept;
    }
    reject;
}

template bgp UPSTREAM4 {
    local as ORIGIN_ASN;
    ipv4 { import none; export filter only_mine_v4; };
}

template bgp UPSTREAM6 {
    local as ORIGIN_ASN;
    ipv6 { import none; export filter only_mine_v6; };
}

# Provider A (the backup: prepended announcement)
protocol bgp provider_a_v4 from UPSTREAM4 {
    description "Provider A - IPv4";
    ipv4 { import none; export filter prepended_v4; };
    source address 10.200.1.10;
    neighbor 10.200.1.20 as PROVIDER_A_ASN;
}
protocol bgp provider_a_v6 from UPSTREAM6 {
    description "Provider A - IPv6";
    ipv6 { import none; export filter prepended_v6; };
    source address fd00:1::10;
    neighbor fd00:1::20 as PROVIDER_A_ASN;
}

# Provider B (the preferred one: plain announcement)
protocol bgp provider_b_v4 from UPSTREAM4 {
    description "Provider B - IPv4";
    source address 10.200.2.10;
    neighbor 10.200.2.20 as PROVIDER_B_ASN;
}
protocol bgp provider_b_v6 from UPSTREAM6 {
    description "Provider B - IPv6";
    source address fd00:2::10;
    neighbor fd00:2::20 as PROVIDER_B_ASN;
}

# peer - a private peering link (not transit): the same export filter as the
# providers, but the relationship is bilateral, not customer-provider. See
# the guide's route-leak experiment (step7-leak-on): peer is not supposed to
# pass this on to anyone, and when it misconfigures itself and does, this
# session is exactly how that leaked route enters the lab in the first place.
protocol bgp peer_v4 from UPSTREAM4 {
    description "peer (private peering) - IPv4";
    source address 10.200.9.20;
    neighbor 10.200.9.10 as PEER_ASN;
}
protocol bgp peer_v6 from UPSTREAM6 {
    description "peer (private peering) - IPv6";
    source address fd00:9::20;
    neighbor fd00:9::10 as PEER_ASN;
}
