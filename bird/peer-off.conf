################################################################################
# peer (AS64999) - a legitimate network with a private peering link to the
# origin, and its own transit from Provider A. Not a customer or a provider
# of the origin - just a peer, exchanging routes bilaterally.
#
# This file (OFF) is the correct, non-leaking configuration: it receives the
# origin's prefixes over the peering link, but does not pass them on to its
# own provider. Toggle the misconfiguration with:
#
#   ./scripts/lab.sh step7-leak-on    starts re-announcing them to Provider A
#   ./scripts/lab.sh step9-leak-off   back to this file (correct behavior)
################################################################################

include "/etc/bird-lab/vars.conf";

log stderr all;
router id 10.0.0.52;

protocol device { }

protocol bgp origin_v4 {
    description "Peering with the origin AS (private link) - IPv4";
    local as PEER_ASN;
    source address 10.200.9.10;
    neighbor 10.200.9.20 as ORIGIN_ASN;
    ipv4 { import all; export none; };
}
protocol bgp origin_v6 {
    description "Peering with the origin AS (private link) - IPv6";
    local as PEER_ASN;
    source address fd00:9::10;
    neighbor fd00:9::20 as ORIGIN_ASN;
    ipv6 { import all; export none; };
}

protocol bgp provider_a_v4 {
    description "Transit from Provider A - IPv4";
    local as PEER_ASN;
    source address 10.200.10.10;
    neighbor 10.200.10.20 as PROVIDER_A_ASN;
    ipv4 { import none; export none; };
}
protocol bgp provider_a_v6 {
    description "Transit from Provider A - IPv6";
    local as PEER_ASN;
    source address fd00:10::10;
    neighbor fd00:10::20 as PROVIDER_A_ASN;
    ipv6 { import none; export none; };
}
