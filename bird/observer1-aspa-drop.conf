################################################################################
# observer1 - BIRD + Routinator  (STAGE aspa-drop: ROV dropping + ASPA verification dropping)
#
# The full policy: ROV Invalid AND ASPA Invalid routes are rejected on import.
# This is where a real, fully deployed router ends up.
#
# Switch stages with ./scripts/lab.sh (step1-clean, step3-rov-mark,
# step3-rov-drop, step5-aspa-mark, step5-aspa-drop). Compare this file with the
# other observer1-*.conf: what changes from one stage to the next is the lesson.
#
# observer2 (OpenBGPD + FORT) is switched together with this one and does the
# same thing in its own words: see openbgpd/observer2-aspa-drop.conf.
################################################################################

include "/etc/bird-lab/vars.conf";

# Not used by any session: it only lets the panel tell which stage's file BIRD
# has loaded (birdc "show symbols filter" lists it).
filter stage_aspa_drop_marker { accept; }

log stderr all;
router id 10.0.0.98;

protocol device { }

# ---------------------------------------------------------------------------
# 1) The validator: BIRD learns the ROAs and the ASPAs from Routinator over RTR.
# ---------------------------------------------------------------------------
roa4 table roa4_table;
roa6 table roa6_table;
aspa table aspa_table;

protocol rpki routinator {
    description "Routinator via RTR";
    remote 172.30.0.20 port 3323;     # container name: routinator

    roa4 { table roa4_table; };
    roa6 { table roa6_table; };
    aspa { table aspa_table; };       # ASPA only exists on RTR version 2

    retry 30;
    refresh 120;
    expire 3600;
}

# ---------------------------------------------------------------------------
# 2) The policy: test each route and act on the result.
#
# Marking convention (large communities), to make reading easier:
#
#   (OBSERVER1_ASN,1,0) ROV Invalid     (OBSERVER1_ASN,2,0) ASPA Invalid
#   (OBSERVER1_ASN,1,1) ROV NotFound    (OBSERVER1_ASN,2,1) ASPA Unknown
#   (OBSERVER1_ASN,1,2) ROV Valid       (OBSERVER1_ASN,2,2) ASPA Valid
# ---------------------------------------------------------------------------

filter import_customer_v4 {
    # ROV - RFC 6811. The route's origin AS is the LAST AS in its path.
    if roa_check(roa4_table, net, bgp_path.last) = ROA_INVALID then
        reject "ROV Invalid: ", net, " origin AS", bgp_path.last;
    else if roa_check(roa4_table, net, bgp_path.last) = ROA_VALID then
        bgp_large_community.add((OBSERVER1_ASN,1,2));
    else
        bgp_large_community.add((OBSERVER1_ASN,1,1));

    # ASPA verification. CUSTOMER session => "Algorithm for Upstream Paths"
    # (the strictest one): every hop of the path must be an authorized
    # customer->provider pair.
    case aspa_check_upstream(aspa_table) {
        ASPA_INVALID: reject "ASPA Invalid: ", net, " AS_PATH ", bgp_path;
        ASPA_VALID: {
            bgp_large_community.add((OBSERVER1_ASN,2,2));
            bgp_local_pref = 200;                 # prefer a proven path
        }
        ASPA_UNKNOWN: bgp_large_community.add((OBSERVER1_ASN,2,1));
    }

    accept;
}

filter import_customer_v6 {
    # ROV - RFC 6811. The route's origin AS is the LAST AS in its path.
    if roa_check(roa6_table, net, bgp_path.last) = ROA_INVALID then
        reject "ROV Invalid: ", net, " origin AS", bgp_path.last;
    else if roa_check(roa6_table, net, bgp_path.last) = ROA_VALID then
        bgp_large_community.add((OBSERVER1_ASN,1,2));
    else
        bgp_large_community.add((OBSERVER1_ASN,1,1));

    # ASPA verification. CUSTOMER session => "Algorithm for Upstream Paths"
    # (the strictest one): every hop of the path must be an authorized
    # customer->provider pair.
    case aspa_check_upstream(aspa_table) {
        ASPA_INVALID: reject "ASPA Invalid: ", net, " AS_PATH ", bgp_path;
        ASPA_VALID: {
            bgp_large_community.add((OBSERVER1_ASN,2,2));
            bgp_local_pref = 200;                 # prefer a proven path
        }
        ASPA_UNKNOWN: bgp_large_community.add((OBSERVER1_ASN,2,1));
    }

    accept;
}

# "import table on" keeps the Adj-RIB-In, and "rpki reload on" makes BIRD
# revalidate what it already holds when the ROA/ASPA tables change (for
# instance after you fix an object in Krill) - no need to touch the router.
template bgp CUSTOMER4 {
    local as OBSERVER1_ASN;
    ipv4 {
        import filter import_customer_v4;
        export none;
        import table on;
        rpki reload on;
    };
}

template bgp CUSTOMER6 {
    local as OBSERVER1_ASN;
    ipv6 {
        import filter import_customer_v6;
        export none;
        import table on;
        rpki reload on;
    };
}

protocol bgp provider_a_v4 from CUSTOMER4 {
    description "Provider A - IPv4";
    source address 10.200.3.20;
    neighbor 10.200.3.10 as PROVIDER_A_ASN;
}
protocol bgp provider_a_v6 from CUSTOMER6 {
    description "Provider A - IPv6";
    source address fd00:3::20;
    neighbor fd00:3::10 as PROVIDER_A_ASN;
}
protocol bgp provider_b_v4 from CUSTOMER4 {
    description "Provider B - IPv4";
    source address 10.200.4.20;
    neighbor 10.200.4.10 as PROVIDER_B_ASN;
}
protocol bgp provider_b_v6 from CUSTOMER6 {
    description "Provider B - IPv6";
    source address fd00:4::20;
    neighbor fd00:4::10 as PROVIDER_B_ASN;
}

# AS666 - the "attacker" from the guide's story. Same templates as the providers,
# so it gets exactly the same treatment: nothing about it is special-cased.
protocol bgp attacker_v4 from CUSTOMER4 {
    description "AS666 (attacker, a direct customer) - IPv4";
    source address 10.200.7.20;
    neighbor 10.200.7.10 as ATTACKER_ASN;
}
protocol bgp attacker_v6 from CUSTOMER6 {
    description "AS666 (attacker, a direct customer) - IPv6";
    source address fd00:7::20;
    neighbor fd00:7::10 as ATTACKER_ASN;
}
