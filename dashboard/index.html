<!DOCTYPE html>
<!-- SPDX-License-Identifier: Apache-2.0
     Copyright 2026 The rpki-selflab authors -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RPKI SelfLab</title>
<script>
  try { const th = localStorage.getItem("rpki-selflab-theme");
        document.documentElement.dataset.theme = (th === "dark") ? "dark" : "light"; } catch (_) {}
</script>
<link rel="stylesheet" href="app.css">
</head>
<body>

<header>
  <div class="brand">
    <h1 data-i18n="h1">RPKI SelfLab</h1>
    <div class="tagline" data-i18n="tagline"></div>
  </div>
  <span class="segmented mobile-tabs" id="mobile-tabs">
    <button data-view="guide" data-i18n="tab_guide">Guide</button>
    <button data-view="topology" data-i18n="tab_topology">Topology</button>
  </span>
  <nav class="toolbar" id="toolbar" aria-label="Tools">
    <button class="tool" data-tool="lab"><span class="ico">⌨</span><span data-i18n="tb_terminal"></span></button>
    <button class="tool" data-tool="commands"><span class="ico">☰</span><span data-i18n="tb_commands"></span></button>
    <button class="tool" data-tool="krill"><span class="ico">🔐</span>Krill</button>
    <button class="tool" data-tool="routinator"><span class="ico">✔</span>Routinator</button>
    <button class="tool" data-tool="registry"><span class="ico">🏛</span><span id="tool-registry-label" data-i18n="tool_registry"></span></button>
  </nav>
  <span class="spacer"></span>
  <span class="stage-badge" id="stage-badge" data-i18n-title="stage_tip">validation —</span>
  <button class="step-chip hidden" id="step-chip" data-i18n-title="step_chip_tip"></button>
  <span class="score" id="score" data-i18n-title="score_tip">⭐ 0</span>
  <button class="btn icon-btn" id="btn-guide-toggle"></button>
  <button class="btn icon-btn" id="btn-help" aria-label="Help">?</button>
  <button class="btn icon-btn" id="btn-theme" type="button"></button>
  <span class="language-switcher" id="language-switcher"></span>
  <span class="clock" id="clock" data-i18n="connecting">connecting…</span>
</header>

<div class="banner" id="banner"></div>

<main id="main">
  <section class="pane" id="guide-pane" aria-label="Guide">
    <div class="guide-nav">
      <button class="btn" id="guide-prev" data-i18n="guide_prev">◀</button>
      <select id="guide-select" data-i18n-aria="guide_aria_select"></select>
      <button class="btn pri" id="guide-next" data-i18n="guide_next">▶</button>
      <span class="counter" id="guide-counter">—</span>
    </div>
    <div class="progress" id="guide-progress"></div>
    <!-- Mode and "Commands in" switches: hidden while SHOW_GUIDE_OPTS (guide.js)
         is false; the guide then runs in Challenge mode, commands in the panel. -->
    <div class="guide-opts" id="guide-opts" hidden>
      <span class="opt-label" data-i18n="mode_label">Mode</span>
      <span class="segmented" id="mode-switch" data-i18n-title="mode_tip">
        <button data-mode="guided" data-i18n="mode_guided">Guided</button>
        <button data-mode="challenge" data-i18n="mode_challenge">Challenge</button>
      </span>
      <span class="opt-label" data-i18n="run_label">Commands in</span>
      <span class="segmented" id="run-switch" data-i18n-title="run_tip">
        <button data-run="panel" data-i18n="run_panel">the panel</button>
        <button data-run="host" data-i18n="run_host">my terminal</button>
      </span>
    </div>
    <div class="guide-body" id="guide-body" data-i18n="guide_loading">loading the guide…</div>
  </section>

  <div class="splitter" id="split-guide" role="separator" aria-orientation="vertical"></div>

  <section class="pane" id="center-pane" aria-label="Topology">
    <div class="topology-wrap">
        <svg viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Lab topology" id="svg-topology">
          <defs>
            <symbol id="ico-router" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7.3"/><path d="M9.6 6.4L12.5 3.5M9.8 3.5H12.5V6.2M6.4 9.6L3.5 12.5M6.2 12.5H3.5V9.8M3.5 3.5L6.4 6.4M3.8 6.5H6.5V3.8M12.5 12.5L9.6 9.6M9.5 12.2V9.5H12.2"/></symbol>
            <symbol id="ico-server" viewBox="0 0 16 16"><rect x="1.8" y="2" width="12.4" height="5" rx="1.2"/><rect x="1.8" y="9" width="12.4" height="5" rx="1.2"/><path d="M4.4 4.5H4.5M4.4 11.5H4.5M8 4.5H11.6M8 11.5H11.6"/></symbol>
            <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
                    markerHeight="6" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" style="fill: var(--link-bgp)"/>
            </marker>
          </defs>

          <!-- RPKI links. Routinator and FORT pull the repository over RRDP and
               hand the result to their observer over RTR. observer2 pulls it
               itself: rpki-client runs on the router's own host, so the RRDP
               line goes straight to it. Krill <-> registry is routed around the
               right edge so it doesn't cross anything. -->
          <path class="link rpki" d="M800,595 L968,595 L968,34 L596,34"/>
          <path class="link rpki" d="M384,62 L185,62 L185,110"/>
          <path class="link rpki" id="e-rrdp-obs2" d="M490,88.5 L490,205"/>
          <path class="link rpki" d="M596,62 L795,62 L795,110"/>
          <path class="link rpki" id="e-rtr1" d="M185,174 L185,205"/>
          <path class="link rpki" id="e-rtr3" d="M795,174 L795,205"/>
          <text class="label" x="976" y="350" transform="rotate(-90 976 350)">RFC 6492 / 8181</text>
          <text class="label" x="290" y="55" text-anchor="middle">RRDP</text>
          <text class="label" x="498" y="150">RRDP</text>
          <text class="label" x="690" y="55" text-anchor="middle">RRDP</text>
          <text class="label" x="193" y="193">RTR :3323</text>
          <text class="label" x="803" y="193">RTR :3323</text>

          <!-- BGP links. The origin is a customer of both providers, and each
               provider hands the same prefix to ALL three observers. -->
          <path class="link bgp" id="e-org-a" d="M450,554.8 L328,455.2" marker-end="url(#arrow)"/>
          <path class="link bgp" id="e-org-b" d="M530,554.8 L652,455.2" marker-end="url(#arrow)"/>
          <path class="link bgp" id="e-a-obs1" d="M270,374.8 L150,285.5" marker-end="url(#arrow)"/>
          <path class="link bgp" id="e-a-obs2" d="M340,374.8 L420,285.5" marker-end="url(#arrow)"/>
          <path class="link bgp" id="e-a-obs3" d="M400,374.8 L730,285.5" marker-end="url(#arrow)"/>
          <path class="link bgp" id="e-b-obs1" d="M580,374.8 L255,285.5" marker-end="url(#arrow)"/>
          <path class="link bgp" id="e-b-obs2" d="M640,374.8 L560,285.5" marker-end="url(#arrow)"/>
          <path class="link bgp" id="e-b-obs3" d="M710,374.8 L835,285.5" marker-end="url(#arrow)"/>
          <!-- peer: a bilateral peering link with the origin, plus transit from
               Provider A. The route leak travels over the transit link. -->
          <path class="link bgp" id="e-peer-org" d="M325.1,595 L399.9,595"/>
          <path class="link bgp" id="e-peer-a" d="M255,554.8 L288,455.2" marker-end="url(#arrow)"/>
          <text class="label" x="362" y="588" text-anchor="middle">peering</text>

          <!-- AS666: a customer of the observers, at the same level as the providers -->
          <path class="link bgp hostile" id="e-atk-obs1" d="M445,378 L205,285.5" marker-end="url(#arrow)"/>
          <path class="link bgp hostile" id="e-atk-obs2" d="M490,378 L490,285.5" marker-end="url(#arrow)"/>
          <path class="link bgp hostile" id="e-atk-obs3" d="M535,378 L780,285.5" marker-end="url(#arrow)"/>

          <text class="label" x="380" y="515">eBGP</text>
          <text class="label" x="590" y="515">eBGP</text>

          <!-- animated dots over the links that carry routes (app.js) -->
          <g id="flow-layer"></g>

          <!-- same-organization groupings: each separate validator with its
               observer, and the origin with its CA -->
          <rect class="org-group" x="83" y="100" width="204" height="195.5"/>
          <rect class="org-group" x="693" y="100" width="204" height="195.5"/>
          <rect class="org-group" x="384.9" y="539.8" width="445" height="110.5"/>
          <text class="org-label" id="n-holder" x="607" y="532.8" text-anchor="middle">ACME Internet Ltda.</text>

          <!-- the registry: local RIR/NIR or beta.registro.br, depending on MODE -->
          <g class="node" data-id="registry" tabindex="0">
            <rect x="384" y="19.5" width="212" height="69"/>
            <use class="ico" href="#ico-server" x="390.4" y="25.2" width="23.5" height="23.5"/>
            <text class="title" x="490" y="42.5" text-anchor="middle" id="n-registry">registry</text>
            <text class="role" x="490" y="58.6" text-anchor="middle" id="n-registry-role">RIR/NIR · TA + repository</text>
            <text class="status" id="s-registry" x="490" y="77" text-anchor="middle">&#8212;</text>
          </g>

          <g class="node" data-id="routinator" tabindex="0">
            <rect x="97.5" y="110" width="175" height="64"/>
            <use class="ico" href="#ico-server" x="103.9" y="115.7" width="23.5" height="23.5"/>
            <text class="title" x="185" y="131" text-anchor="middle">Routinator</text>
            <text class="role" x="185" y="147" text-anchor="middle" id="n-routinator-role">validator · RTR</text>
            <text class="status" id="s-routinator" x="185" y="165" text-anchor="middle">&#8212;</text>
          </g>

          <g class="node" data-id="fort" tabindex="0">
            <rect x="707.5" y="110" width="175" height="64"/>
            <use class="ico" href="#ico-server" x="713.9" y="115.7" width="23.5" height="23.5"/>
            <text class="title" x="795" y="131" text-anchor="middle">FORT</text>
            <text class="role" x="795" y="147" text-anchor="middle" id="n-fort-role">validator · RTR</text>
            <text class="status" id="s-fort" x="795" y="165" text-anchor="middle">&#8212;</text>
          </g>

          <g class="node" data-id="observer1" tabindex="0">
            <rect x="95" y="205" width="180" height="80.5"/>
            <use class="ico" href="#ico-router" x="101.4" y="210.7" width="23.5" height="23.5"/>
            <text class="title" x="185" y="231.4" text-anchor="middle" id="n-observer1-title">observer1</text>
            <text class="asn" x="185" y="248.6" text-anchor="middle" id="n-observer1-asn">AS64509</text>
            <text class="role" x="185" y="264.8" text-anchor="middle" id="n-observer1-role">BIRD · ROV + ASPA</text>
            <text class="status" id="s-observer1" x="185" y="279.7" text-anchor="middle">&#8212;</text>
          </g>

          <!-- observer2: router and validator on the same host, so one box -->
          <g class="node" data-id="observer2" tabindex="0">
            <rect x="370" y="205" width="240" height="80.5"/>
            <use class="ico" href="#ico-router" x="376.4" y="210.7" width="23.5" height="23.5"/>
            <text class="title" x="490" y="231.4" text-anchor="middle" id="n-observer2-title">observer2</text>
            <text class="asn" x="490" y="248.6" text-anchor="middle" id="n-observer2-asn">AS64510</text>
            <text class="role" x="490" y="264.8" text-anchor="middle" id="n-observer2-role">OpenBGPD + rpki-client</text>
            <text class="status" id="s-observer2" x="490" y="279.7" text-anchor="middle">&#8212;</text>
          </g>

          <g class="node" data-id="observer3" tabindex="0">
            <rect x="705" y="205" width="180" height="80.5"/>
            <use class="ico" href="#ico-router" x="711.4" y="210.7" width="23.5" height="23.5"/>
            <text class="title" x="795" y="231.4" text-anchor="middle" id="n-observer3-title">observer3</text>
            <text class="asn" x="795" y="248.6" text-anchor="middle" id="n-observer3-asn">AS64511</text>
            <text class="role" x="795" y="264.8" text-anchor="middle" id="n-observer3-role">OpenBGPD · ROV + ASPA</text>
            <text class="status" id="s-observer3" x="795" y="279.7" text-anchor="middle">&#8212;</text>
          </g>

          <g class="node" data-id="provider-a" tabindex="0">
            <rect x="237.9" y="374.8" width="180.2" height="80.5"/>
            <use class="ico" href="#ico-router" x="244.3" y="380.5" width="23.5" height="23.5"/>
            <text class="title" x="328" y="401.2" text-anchor="middle" id="n-provider-a-title">Provider A</text>
            <text class="asn" id="n-provider-a-asn" x="328" y="418.4" text-anchor="middle">AS64501</text>
            <text class="role" x="328" y="434.6" text-anchor="middle" id="n-provider-a-role">upstream of the origin</text>
            <text class="status" id="s-provider-a" x="328" y="449.5" text-anchor="middle">&#8212;</text>
          </g>

          <g class="node" data-id="provider-b" tabindex="0">
            <rect x="561.9" y="374.8" width="180.2" height="80.5"/>
            <use class="ico" href="#ico-router" x="568.3" y="380.5" width="23.5" height="23.5"/>
            <text class="title" x="652" y="401.2" text-anchor="middle" id="n-provider-b-title">Provider B</text>
            <text class="asn" id="n-provider-b-asn" x="652" y="418.4" text-anchor="middle">AS64502</text>
            <text class="role" x="652" y="434.6" text-anchor="middle" id="n-provider-b-role">upstream of the origin</text>
            <text class="status" id="s-provider-b" x="652" y="449.5" text-anchor="middle">&#8212;</text>
          </g>

          <g class="node" data-id="origin" tabindex="0">
            <rect x="399.9" y="554.8" width="180.2" height="80.5"/>
            <use class="ico" href="#ico-router" x="406.3" y="560.5" width="23.5" height="23.5"/>
            <text class="title" x="490" y="581.2" text-anchor="middle" id="n-origin-title">origin</text>
            <text class="asn" id="n-origin-asn" x="490" y="598.5" text-anchor="middle">AS64500</text>
            <text class="role" x="490" y="614.5" text-anchor="middle" id="n-origin-role">originates the prefixes</text>
            <text class="status" id="s-origin" x="490" y="629.5" text-anchor="middle">&#8212;</text>
          </g>

          <g class="node hostile" data-id="attacker" tabindex="0">
            <rect x="425.3" y="378" width="129.3" height="77"/>
            <use class="ico" href="#ico-router" x="431.7" y="383.7" width="23.5" height="23.5"/>
            <text class="title" x="490" y="399.8" text-anchor="middle" id="n-attacker-title">attacker</text>
            <text class="asn" id="n-attacker-asn" x="490" y="415.9" text-anchor="middle">AS666</text>
            <text class="role" x="490" y="432" text-anchor="middle" id="n-attacker-role">hijacker</text>
            <text class="status" id="s-attacker" x="490" y="447" text-anchor="middle">&#8212;</text>
          </g>

          <g class="node" data-id="peer" tabindex="0">
            <rect x="144.9" y="554.8" width="180.2" height="80.5"/>
            <use class="ico" href="#ico-router" x="151.3" y="560.5" width="23.5" height="23.5"/>
            <text class="title" x="235" y="581.2" text-anchor="middle" id="n-peer-title">peer</text>
            <text class="asn" id="n-peer-asn" x="235" y="598.5" text-anchor="middle">AS64499</text>
            <text class="role" x="235" y="614.5" text-anchor="middle" id="n-peer-role">peers with the origin</text>
            <text class="status" id="s-peer" x="235" y="629.5" text-anchor="middle">&#8212;</text>
          </g>

          <g class="node" data-id="krill" tabindex="0">
            <rect x="625" y="560.5" width="174.9" height="69"/>
            <use class="ico" href="#ico-server" x="631.4" y="566.2" width="23.5" height="23.5"/>
            <text class="title" x="712" y="583.5" text-anchor="middle">Krill</text>
            <text class="role" x="712" y="599.6" text-anchor="middle" id="n-krill-role">CA · creates ROA and ASPA</text>
            <text class="status" id="s-krill" x="712" y="618" text-anchor="middle">&#8212;</text>
          </g>
        </svg>

    </div>
    <div class="splitter horizontal" id="split-bottom" role="separator" aria-orientation="horizontal"></div>
    <div class="bottom-box">
      <div class="bottom-head">
        <!-- one tab per observer (app.js remembers the choice); a "≠" on a tab
             means that observer's verdicts differ from the others' -->
        <span class="segmented" id="bottom-tabs">
          <button data-bottom="observer1"><span data-i18n="tab_observer1">observer1</span><span class="diverge hidden" data-i18n-title="diverge_tip">≠</span></button>
          <button data-bottom="observer2"><span data-i18n="tab_observer2">observer2</span><span class="diverge hidden" data-i18n-title="diverge_tip">≠</span></button>
          <button data-bottom="observer3"><span data-i18n="tab_observer3">observer3</span><span class="diverge hidden" data-i18n-title="diverge_tip">≠</span></button>
          <button data-bottom="events" data-i18n="events_title">Events</button>
        </span>
        <span class="legend" id="legend"></span>
      </div>
      <div class="bottom-scroll" id="bottom-verdicts">
        <table class="verdicts" id="tab-verdicts">
          <thead><tr>
            <th data-i18n="th_prefix">Prefix</th><th data-i18n="th_received">Received from</th>
            <th>AS_PATH</th><th>ROV</th><th>ASPA</th><th>local_pref</th>
          </tr></thead>
          <tbody><tr><td colspan="6" data-i18n="verdicts_waiting">waiting for data…</td></tr></tbody>
        </table>
      </div>
      <div class="bottom-scroll hidden" id="bottom-events"><ul class="events" id="events"></ul></div>
    </div>
  </section>

  <div class="splitter hidden" id="split-dock" role="separator" aria-orientation="vertical"></div>

  <aside class="pane" id="panel" aria-live="polite"></aside>

  <section class="pane hidden" id="dock" aria-label="Terminals and web interfaces">
    <div class="dock-bar">
      <div class="dock-tabs" id="dock-tabs"></div>
      <button class="btn small" id="dock-newtab" data-i18n-title="dock_new_tab">↗</button>
      <button class="btn small" id="dock-wide"></button>
      <button class="btn small" id="dock-close" data-i18n-title="dock_close">✕</button>
    </div>
    <div class="dock-frames" id="dock-frames"></div>
  </section>
</main>

<div id="toasts" aria-live="polite"></div>
<div class="popover hidden" id="popover"></div>

<dialog id="help-dialog">
  <h2 data-i18n="help_title">How to use this panel</h2>
  <p data-i18n-html="help_intro"></p>
  <h3 data-i18n="help_keys">Keyboard</h3>
  <table>
    <tr><td><kbd>←</kbd> <kbd>→</kbd></td><td data-i18n="key_steps"></td></tr>
    <tr><td><kbd>Esc</kbd></td><td data-i18n="key_esc"></td></tr>
    <tr><td><kbd>g</kbd></td><td data-i18n="key_guide"></td></tr>
    <tr><td><kbd>?</kbd></td><td data-i18n="key_help"></td></tr>
  </table>
  <h3 data-i18n="help_modes">Modes</h3>
  <p data-i18n-html="help_modes_text"></p>
  <h3 data-i18n="help_score">Points</h3>
  <p data-i18n-html="help_score_text"></p>
  <p><label><input type="checkbox" id="opt-anim"> <span data-i18n="help_anim"></span></label></p>
  <p style="display:flex; gap:8px; justify-content:space-between; flex-wrap:wrap">
    <button class="btn" id="btn-reset-progress" data-i18n="help_reset"></button>
    <button class="btn pri" id="btn-help-close" data-i18n="help_close"></button>
  </p>
</dialog>

<script src="language.js"></script>
<script src="i18n.js"></script>
<script src="nodes.js"></script>
<script src="checks.js"></script>
<script src="guide.js"></script>
<script src="app.js"></script>
</body>
</html>
