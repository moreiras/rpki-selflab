# Krill for the lab's simulated RIR.
#
# Krill's "testbed" mode brings up, in a single process:
#   - a trust anchor (TA) holding all resources;
#   - a CA that is a child of the TA - it plays the role of the RIR/NIR;
#   - an RFC 8181 publication server;
#   - the TAL at /ta/ta.tal and the TA certificate at /ta/ta.cer.
#
# The registry panel (lab-rir-web container) does NOT use the testbed's open
# page: it talks to the authenticated API, to delegate exactly the resources
# allocated in lab.conf.
# =============================================================================

ip         = "::"
port       = 3000
data_dir   = "/var/krill/data"
log_type   = "stderr"
log_level  = "info"

admin_token = "passlab"

# The name needs to resolve inside the lab's network: it's what gets
# recorded inside the signed objects and the RFC 8183 responses.
service_uri = "https://rir.lab:3000/"

# The certificate is the one issued by the internal CA (lab-pki-init container).
https_mode = "existing"

[testbed]
rrdp_base_uri = "https://rir.lab:3000/rrdp/"
rsync_jail    = "rsync://rir.lab/repo/"
ta_aia        = "rsync://rir.lab/ta/ta.cer"
ta_uri        = "https://rir.lab:3000/ta/ta.cer"
